name: Build Hwraith

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  engine:
    name: Engine tests and demo render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack source bundle
        # Lets you upload one source.zip from a phone instead of many folders.
        run: |
          if [ ! -f CMakeLists.txt ] && [ -f source.zip ]; then unzip -q source.zip; fi
          ls

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Render demo song
        run: ./build/hwdemo demo.wav

      - name: Upload demo song
        uses: actions/upload-artifact@v4
        with:
          name: hwraith-demo-wav
          path: demo.wav

  android:
    # Does real work only once an android/ project exists (Stage 1); until then every step after the check is skipped.
    name: Android APK
    runs-on: ubuntu-latest
    needs: engine
    steps:
      - uses: actions/checkout@v4

      - name: Check for Android project
        id: chk
        run: |
          if [ -f android/settings.gradle.kts ]; then echo "has=true" >> "$GITHUB_OUTPUT"; else echo "has=false" >> "$GITHUB_OUTPUT"; echo "No android/ project yet, skipping."; fi

      - uses: actions/setup-java@v4
        if: steps.chk.outputs.has == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        if: steps.chk.outputs.has == 'true'

      - name: Install NDK and CMake
        if: steps.chk.outputs.has == 'true'
        run: sdkmanager "ndk;26.1.10909125" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        if: steps.chk.outputs.has == 'true'
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        if: steps.chk.outputs.has == 'true'
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        if: steps.chk.outputs.has == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hwraith-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          
