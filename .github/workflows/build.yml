name: Build Hwush Studio

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  engine:
    name: Engine tests and demo render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack source bundle
        # Lets you upload one source.zip from a phone instead of many folders.
        run: |
          if [ ! -f CMakeLists.txt ] && [ -f source.zip ]; then unzip -q source.zip; fi
          ls

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Render demo song
        run: ./build/hwdemo demo.wav

      - name: Upload demo song
        uses: actions/upload-artifact@v4
        with:
          name: hwush-studio-demo-wav
          path: demo.wav

  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: engine
    steps:
      - uses: actions/checkout@v4

      - name: Unpack source bundle
        run: |
          if [ ! -f CMakeLists.txt ] && [ -f source.zip ]; then unzip -q source.zip; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner already has the Android SDK, so no setup-android action is needed.
      - name: Install NDK and CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;26.1.10909125" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk HwushStudio-debug.apk

      - name: Upload APK as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: hwush-studio-debug-apk
          path: HwushStudio-debug.apk

      - name: Publish to Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: studio-dev
          name: Hwush Studio dev build
          body: Latest debug build of Hwush Studio. Replaced on every successful build.
          prerelease: true
          files: HwushStudio-debug.apk
