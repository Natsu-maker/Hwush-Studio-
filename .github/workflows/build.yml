name: Build Hwraith

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  engine:
    name: Engine tests and demo render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Render demo song
        run: ./build/hwdemo demo.wav

      - name: Upload demo song
        uses: actions/upload-artifact@v4
        with:
          name: hwraith-demo-wav
          path: demo.wav

  android:
    # Runs only once an android/ project exists (Stage 1). Until then this job is skipped.
    name: Android APK
    runs-on: ubuntu-latest
    needs: engine
    if: ${{ hashFiles('android/settings.gradle.kts') != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: sdkmanager "ndk;26.1.10909125" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hwraith-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
